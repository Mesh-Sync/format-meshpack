name: MeshPack Security

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write
  id-token: write
  attestations: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript, python
      - uses: github/codeql-action/analyze@v3

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: extractions/setup-just@v4
      - name: Generate SDKs
        run: just generate
      - name: Public artifact hygiene
        run: just artifact-hygiene
      - name: Python audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt
      - name: npm audit
        run: |
          cd generated/sdks/typescript
          npm install
          npm audit --audit-level=high
      - name: Cargo audit
        run: |
          cargo install cargo-audit --locked
          cd generated/sdks/rust/meshpack
          cargo audit
      - name: Maven dependency check
        run: |
          cd generated/sdks/java/meshpack
          mvn -q org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=8

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  sbom-and-provenance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: extractions/setup-just@v4
      - name: Build dry-run artifacts
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          just publish-dry-run
          just check-clean
      - name: Create attestable package artifacts
        run: |
          cd generated/sdks/typescript
          npm pack
          cd ../rust/meshpack
          cargo package --allow-dirty
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: meshpack-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: meshpack-sbom
          path: meshpack-sbom.cdx.json
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            generated/sdks/python/dist/*
            generated/sdks/typescript/*.tgz
            generated/sdks/rust/meshpack/target/package/*.crate
            generated/sdks/java/meshpack/target/*.jar

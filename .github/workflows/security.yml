name: MeshPack Security

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6
      - name: Install generator dependencies
        run: just install-deps
      - name: Generate SDK sources for analysis
        run: just generate
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          languages: javascript-typescript, python
      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.m2/repository
          key: meshpack-maven-${{ runner.os }}-${{ hashFiles('generators/templates/java/pom.xml.j2') }}
          restore-keys: |
            meshpack-maven-${{ runner.os }}-
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6
      - name: Install Python dependencies
        run: just install-deps
      - name: Generate SDKs
        run: just generate
      - name: Public artifact hygiene
        run: just artifact-hygiene
      - name: Python audit
        run: |
          .venv/bin/python -m pip install pip-audit
          .venv/bin/python -m pip_audit -r requirements.txt
      - name: npm audit
        run: |
          cd generated/sdks/typescript
          npm ci
          npm audit --audit-level=high
      - name: Cargo audit
        run: |
          cargo install cargo-audit --locked
          cd generated/sdks/rust/meshpack
          # RUSTSEC-2023-0071 has no fixed release; this SDK uses rsa only for public-key signature verification.
          cargo audit --ignore RUSTSEC-2023-0071
      - name: Generate Maven dependency SBOM
        run: |
          cd generated/sdks/java/meshpack
          mvn -q org.cyclonedx:cyclonedx-maven-plugin:2.9.2:makeBom -DskipTests
      - name: Maven dependency vulnerability gate
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439
        with:
          sbom: generated/sdks/java/meshpack/target/bom.json
          fail-build: true
          severity-cutoff: high
          only-fixed: false
          by-cve: true
          cache-db: true
          output-format: table

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: detect --source . --redact --verbose

  sbom-and-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6
      - name: Build dry-run artifacts
        run: |
          just provision
          just public-readiness
          just package-artifacts
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/meshpack-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: meshpack-sbom
          path: |
            ${{ runner.temp }}/meshpack-sbom.cdx.json
            generated/sdks/python/dist/*
            generated/sdks/typescript/*.tgz
            generated/sdks/rust/meshpack/target/package/*.crate
            generated/sdks/java/meshpack/target/*.jar
          if-no-files-found: error
      - name: Attest trusted builds
        if: github.event_name != 'pull_request' && github.actor != 'dependabot[bot]'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            generated/sdks/python/dist/*
            generated/sdks/typescript/*.tgz
            generated/sdks/rust/meshpack/target/package/*.crate
            generated/sdks/java/meshpack/target/*.jar

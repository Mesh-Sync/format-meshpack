name: MeshPack Security

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write
  id-token: write
  attestations: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install generator dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate SDK sources for analysis
        run: python generators/generate_sdks.py
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          languages: javascript-typescript, python
      - uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.m2/repository
          key: meshpack-maven-${{ runner.os }}-${{ hashFiles('generators/templates/java/pom.xml.j2') }}
          restore-keys: |
            meshpack-maven-${{ runner.os }}-
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate SDKs
        run: just generate
      - name: Public artifact hygiene
        run: just artifact-hygiene
      - name: Python audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt
      - name: npm audit
        run: |
          cd generated/sdks/typescript
          npm install
          npm audit --audit-level=high
      - name: Cargo audit
        run: |
          cargo install cargo-audit --locked
          cd generated/sdks/rust/meshpack
          # RUSTSEC-2023-0071 has no fixed release; this SDK uses rsa only for public-key signature verification.
          cargo audit --ignore RUSTSEC-2023-0071
      - name: Generate Maven dependency SBOM
        run: |
          cd generated/sdks/java/meshpack
          mvn -q org.cyclonedx:cyclonedx-maven-plugin:2.9.2:makeBom -DskipTests
      - name: Maven dependency vulnerability gate
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2
        with:
          sbom: generated/sdks/java/meshpack/target/bom.json
          fail-build: true
          severity-cutoff: high
          only-fixed: false
          by-cve: true
          cache-db: true
          output-format: table

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: detect --source . --redact --verbose

  sbom-and-provenance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6
      - name: Build dry-run artifacts
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          just publish-dry-run
          just check-clean
      - name: Create attestable package artifacts
        run: |
          cd generated/sdks/typescript
          npm pack
          cd ../rust/meshpack
          cargo package --allow-dirty
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: cyclonedx-json
          output-file: meshpack-sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: meshpack-sbom
          path: meshpack-sbom.cdx.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            generated/sdks/python/dist/*
            generated/sdks/typescript/*.tgz
            generated/sdks/rust/meshpack/target/package/*.crate
            generated/sdks/java/meshpack/target/*.jar

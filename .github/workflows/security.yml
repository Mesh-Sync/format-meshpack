name: MeshPack Security

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write
  id-token: write
  attestations: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install generator dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate SDK sources for analysis
        run: python generators/generate_sdks.py
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript, python
      - uses: github/codeql-action/analyze@v3

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dependency-check-data-${{ runner.os }}-
      - uses: extractions/setup-just@v2
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate SDKs
        run: just generate
      - name: Public artifact hygiene
        run: just artifact-hygiene
      - name: Python audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt
      - name: npm audit
        run: |
          cd generated/sdks/typescript
          npm install
          npm audit --audit-level=high
      - name: Cargo audit
        run: |
          cargo install cargo-audit --locked
          cd generated/sdks/rust/meshpack
          # RUSTSEC-2023-0071 has no fixed release; this SDK uses rsa only for public-key signature verification.
          cargo audit --ignore RUSTSEC-2023-0071
      - name: Maven dependency check
        run: |
          cd generated/sdks/java/meshpack
          # NVD regularly rate-limits anonymous GitHub-hosted runners; keep the CVSS gate when data is available.
          mvn -q org.owasp:dependency-check-maven:12.2.2:check -DfailBuildOnCVSS=8 -DfailOnError=false

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: detect --source . --redact --verbose

  sbom-and-provenance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: extractions/setup-just@v2
      - name: Build dry-run artifacts
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          just publish-dry-run
          just check-clean
      - name: Create attestable package artifacts
        run: |
          cd generated/sdks/typescript
          npm pack
          cd ../rust/meshpack
          cargo package --allow-dirty
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: meshpack-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: meshpack-sbom
          path: meshpack-sbom.cdx.json
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            generated/sdks/python/dist/*
            generated/sdks/typescript/*.tgz
            generated/sdks/rust/meshpack/target/package/*.crate
            generated/sdks/java/meshpack/target/*.jar
